name: website

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install extended version of Hugo
        run: |
          wget -q -O /tmp/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i /tmp/hugo.deb
        env:
          HUGO_VERSION: 0.168.0

      - name: Generate Hugo pages
        run: |
          git submodule init
          git submodule update --recursive
          hugo --minify
          echo -n "burmillaos.org" > public/CNAME

      - name: Add redirection to poll
        run: |
          mkdir public/poll
          cp poll.html public/poll/index.html

      - name: Deploy to GitHub Pages
        if: success()
        uses: crazy-max/ghaction-github-pages@v2
        with:
          target_branch: gh-pages
          build_dir: public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
